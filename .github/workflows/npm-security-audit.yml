name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 4' # Thursdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@9
      - name: Install dependencies
        run: pnpm install
      - name: Audit dependencies
        # Fails on moderate or worse advisories that have a fixed version available.
        run: pnpm audit --audit-level moderate --ignore-unfixable
