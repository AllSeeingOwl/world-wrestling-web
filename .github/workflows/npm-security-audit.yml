name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 4' # Thursdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@9
      - name: Install dependencies
        run: pnpm install
      - name: Audit dependencies
        # Fails on moderate or worse advisories.
        # Note: pnpm 9 has no --ignore-unfixable flag (passing it aborts with
        # "Unknown option"), and in pnpm 10 that flag rewrites package.json
        # instead of auditing, so it must not be used here.
        run: pnpm audit --audit-level moderate
